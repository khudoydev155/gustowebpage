<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gusto Coffee — Stol QR Karta (Menyu)</title>
  <link rel="icon" type="image/svg+xml" href="/logo-mark.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0C0A08;
      --card-bg: #14110E;
      --card-border: #2E261E;
      --gold: #C59853;
      --gold-light: #DDB475;
      --text: #FCFAF7;
      --muted: #D5C9B3;
    }

    body.light-mode {
      --bg: #F4F1EA;
      --card-bg: #FFFFFF;
      --card-border: #E2DACB;
      --gold: #9B7032;
      --gold-light: #7E5A24;
      --text: #1C1713;
      --muted: #5A5046;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      transition: background 0.2s ease;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    .btn {
      appearance: none;
      border: 1px solid var(--gold);
      background: var(--card-bg);
      color: var(--text);
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.05em;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: var(--gold);
      color: #0C0A08;
    }

    .card-container {
      width: 105mm; /* Standard A6 card width */
      height: 148mm; /* Standard A6 card height */
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 12px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      position: relative;
      overflow: hidden;
    }

    .corner-decor {
      position: absolute;
      width: 18px;
      height: 18px;
      border-color: var(--gold);
      opacity: 0.7;
    }
    .corner-tl { top: 12px; left: 12px; border-top: 1.5px solid; border-left: 1.5px solid; }
    .corner-tr { top: 12px; right: 12px; border-top: 1.5px solid; border-right: 1.5px solid; }
    .corner-bl { bottom: 12px; left: 12px; border-bottom: 1.5px solid; border-left: 1.5px solid; }
    .corner-br { bottom: 12px; right: 12px; border-bottom: 1.5px solid; border-right: 1.5px solid; }

    .brand-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .logo-mark {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }

    .brand-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.16em;
      color: var(--text);
      text-transform: uppercase;
      line-height: 1.1;
    }

    .brand-sub {
      font-size: 8.5px;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      color: var(--gold);
      font-weight: 600;
    }

    .qr-frame {
      background: #FFFFFF;
      padding: 12px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      border: 2px solid var(--gold);
      width: 180px;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 8px 0;
    }

    .qr-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: pixelated;
    }

    .instructions {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .instruction-main {
      font-family: 'Cormorant Garamond', serif;
      font-size: 19px;
      font-weight: 600;
      color: var(--gold-light);
      letter-spacing: 0.04em;
    }

    .instruction-sub {
      font-size: 9.5px;
      color: var(--muted);
      line-height: 1.35;
      max-width: 220px;
    }

    .footer-meta {
      width: 100%;
      border-top: 1px dashed var(--card-border);
      padding-top: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 8px;
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    .footer-meta span strong {
      color: var(--gold-light);
    }

    @media print {
      body {
        background: transparent !important;
        padding: 0 !important;
      }
      .toolbar {
        display: none !important;
      }
      .card-container {
        box-shadow: none !important;
        border: 1px solid #CCC !important;
        page-break-after: avoid;
        page-break-inside: avoid;
      }
      @page {
        size: A6 portrait;
        margin: 5mm;
      }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button class="btn" onclick="window.print()">
      🖨️ Chop etish (A6 Format)
    </button>
    <button class="btn" onclick="document.body.classList.toggle('light-mode')">
      🌓 Oq / Qora rejim
    </button>
    <a href="/#menu" class="btn" style="text-decoration:none;">
      ↗️ Saytda ochish
    </a>
  </div>

  <div class="card-container">
    <div class="corner-decor corner-tl"></div>
    <div class="corner-decor corner-tr"></div>
    <div class="corner-decor corner-bl"></div>
    <div class="corner-decor corner-br"></div>

    <div class="brand-header">
      <img src="/logo-mark.svg" alt="Gusto Logo" class="logo-mark">
      <h1 class="brand-title">Gusto Coffee</h1>
      <p class="brand-sub">Coffee Bar • Xonqa</p>
    </div>

    <div class="qr-frame">
      <img src="/qr-menu.png" alt="Gusto Coffee Menu QR" class="qr-image">
    </div>

    <div class="instructions">
      <p class="instruction-main">To'liq Taomnoma</p>
      <p class="instruction-sub">
        Telefon kamerangizni QR-kodga qarating va to'liq menyuni ko'ring.
      </p>
      <p style="font-size: 8.5px; color: var(--gold); margin-top: 3px; font-weight: 500;">
        gustocoffee.uz/#menu
      </p>
    </div>

    <div class="footer-meta">
      <span>TG: <strong>@gustobronbot</strong></span>
      <span>Wi-Fi: <strong>Gusto Guest</strong></span>
      <span>Tel: <strong>+998 93 287 54 84</strong></span>
    </div>
  </div>
</body>
</html>
