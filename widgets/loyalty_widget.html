<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Gusto Club</title>
<style>
:root{--bg:#0C0A08;--c:#181410;--b:#2C241C;--g:#C6924D;--gl:#E6C387;--t:#F5F1EA;--m:#A89F91;--r:10px}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
body{background:var(--bg);color:var(--t);padding:10px;font-size:12px;line-height:1.3;display:flex;flex-direction:column;gap:8px}
.hdr{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--b);padding-bottom:6px;gap:8px}
.hdr b{font-size:13px;color:var(--t);letter-spacing:.3px;white-space:nowrap}
.tag{font-size:10px;background:rgba(198,146,77,.15);color:var(--g);padding:2px 7px;border-radius:12px;border:1px solid rgba(198,146,77,.3);font-weight:600;white-space:nowrap;flex-shrink:0}
.banner{background:linear-gradient(145deg,#221B13,#14110E);border:1px solid var(--b);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.cup{aspect-ratio:1;background:#100D0A;border:1px solid var(--b);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:.15s}
.cup:active{transform:scale(.92)}
.cup.on{background:rgba(198,146,77,.2);border-color:var(--g)}
.cup.rew{border-color:#E67E22;background:rgba(230,126,34,.15)}
.cup.rew.on{background:rgba(243,156,18,.3);border-color:#F39C12}
.cup svg{width:17px;height:17px;stroke:var(--m);fill:none;stroke-width:2;pointer-events:none}
.cup.on svg{stroke:var(--g);fill:rgba(198,146,77,.35)}
.cup.rew.on svg{stroke:#F1C40F;fill:rgba(241,196,15,.5)}
.cup span{font-size:9px;color:var(--m);margin-top:1px;font-weight:600;pointer-events:none}
.cup.on span{color:var(--gl)}
.pbar{width:100%;height:4px;background:#100D0A;border-radius:4px;overflow:hidden}
.pfill{height:100%;background:linear-gradient(90deg,var(--g),#F39C12);width:0%;transition:width .3s}
.desc{font-size:11.5px;color:var(--m);text-align:center;min-height:16px;transition:color .2s}
.desc b{color:var(--gl)}
.card{background:#120E0A;border:1px solid var(--b);border-radius:var(--r);padding:8px 10px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;touch-action:manipulation;transition:all .15s}
.card:active{border-color:var(--g);background:#1A140E}
.card-lbl{font-size:9px;text-transform:uppercase;color:var(--m);font-weight:600}
.card-id{font-size:13px;font-weight:700;color:var(--t);font-family:monospace;letter-spacing:.6px}
.qr{width:46px;height:46px;background:#FFF;border-radius:6px;padding:2px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.qr svg{width:100%;height:100%;display:block}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.btn{background:var(--c);border:1px solid var(--g);color:var(--g);padding:8px 6px;border-radius:var(--r);font-size:11px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;touch-action:manipulation}
.btn.pri{background:linear-gradient(135deg,rgba(198,146,77,.3),rgba(142,96,42,.35));color:#FFF}
.btn:active{transform:scale(.97)}
</style>
</head>
<body>
<div class="hdr">
  <b>☕️ Gusto Coffee Club</b>
  <span class="tag" id="tag">6-chi kofe bepul</span>
</div>
<div class="banner">
  <div class="grid" id="grid"></div>
  <div class="pbar"><div class="pfill" id="pfill"></div></div>
  <div class="desc" id="desc">Yuklanmoqda...</div>
</div>
<div class="card" id="card" title="Nusxa olish uchun bosing">
  <div>
    <div class="card-lbl">Mijoz kodi (bosing - nusxa oladi)</div>
    <div class="card-id" id="cid">GC-••••••</div>
    <div style="font-size:10px;color:var(--m)">Baristaga muhr uchun ko'rsating</div>
  </div>
  <div class="qr" id="qrBox"><!-- QR_SVG_PLACEHOLDER --></div>
</div>
<div class="btns">
  <button type="button" class="btn" id="rBtn">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
    <span id="rtxt">Yangilash</span>
  </button>
  <button type="button" class="btn pri" id="mBtn">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
    <span>Menyu (Mini App)</span>
  </button>
</div>

<script>
(function(){
var S={cups:0,total:6,mid:'GC-GUSTO'};
function hap(t){try{if(window.TelegramWidget&&TelegramWidget.HapticFeedback){TelegramWidget.HapticFeedback.impactOccurred(t||'light')}else if(window.Telegram&&Telegram.WebApp&&Telegram.WebApp.HapticFeedback){Telegram.WebApp.HapticFeedback.impactOccurred(t||'light')}}catch(e){}}
function setDesc(m,isGold){var e=document.getElementById('desc');e.innerHTML=m;if(isGold)e.style.color='#E6C387';setTimeout(function(){e.style.color=''},2500)}
function opn(u){hap('medium');try{if(window.TelegramWidget&&TelegramWidget.openLink){TelegramWidget.openLink(u);return}if(window.Telegram&&Telegram.WebApp&&Telegram.WebApp.openLink){Telegram.WebApp.openLink(u);return}}catch(e){}window.open(u,'_blank')}
function rnd(c,tot){
  var g=document.getElementById('grid');g.innerHTML='';c=Math.max(0,Math.min(tot,parseInt(c)||0));
  for(var i=1;i<=tot;i++){
    var d=document.createElement('div'),rew=(i===tot),on=(i<=c);
    d.className='cup'+(rew?' rew':'')+(on?' on':'');
    d.innerHTML=rew?('<svg viewBox="0 0 24 24"><polygon points="12 2 15 8 22 9 17 14 18 21 12 17 6 21 7 14 2 9 9 8 12 2"/></svg><span>'+(on?'Tayyor!':'Sovg\'a')+'</span>'):('<svg viewBox="0 0 24 24"><path d="M18 8h1a4 4 0 0 1 0 8h-1M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/></svg><span>'+i+'</span>');
    (function(idx,f,r){d.onclick=function(){hap('light');setDesc(r?(f?'🎉 <b>Bepul qahvangiz tayyor!</b> Baristadan oling.':'🎁 6-kofe sovg\'a! Yana '+(tot-c)+' ta qoldi'):(f?'☕️ <b>'+idx+'-muhr hisoblangan!</b>':'⏳ '+idx+'-muhr: Qahva buyurtma qiling'),true)}})(i,on,rew);
    g.appendChild(d);
  }
  document.getElementById('pfill').style.width=((c/tot)*100)+'%';
  var de=document.getElementById('desc'),te=document.getElementById('tag');
  if(c>=tot){de.innerHTML='🎉 <b>Tabriklaymiz!</b> Bepul qahvangiz tayyor!';te.textContent='Sovg\'a tayyor!'}
  else if(c===0){de.innerHTML='Gusto Club: Har bir qahvada <b>1 muhr</b> oling.';te.textContent='6-chi kofe bepul'}
  else{de.innerHTML='Sizda <b>'+c+' ta</b> muhr bor. Yana <b>'+(tot-c)+' ta</b> qahvadan so\'ng sovg\'a!';te.textContent=c+' / '+tot+' muhr'}
}
function upd(d){if(!d)return;if(typeof d==='string'){try{d=JSON.parse(d)}catch(e){return}}if(typeof d.cups!=='undefined')S.cups=d.cups;if(typeof d.total!=='undefined')S.total=d.total;if(d.member_id){S.mid=d.member_id;document.getElementById('cid').textContent=d.member_id}rnd(S.cups,S.total)}

if(window.TelegramWidget){
  if(TelegramWidget.chatData)upd(TelegramWidget.chatData);
  if(typeof TelegramWidget.onEvent==='function'){
    TelegramWidget.onEvent('chatDataChanged',function(){if(TelegramWidget.chatData)upd(TelegramWidget.chatData)});
  }
}else{rnd(0,6)}
window.addEventListener('chatDataChanged',function(){if(window.TelegramWidget&&TelegramWidget.chatData)upd(TelegramWidget.chatData)});

document.getElementById('card').onclick=function(){
  hap('medium');
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(S.mid);
  setDesc('✅ Kod nusxa olindi: '+S.mid+' (Baristaga ko\'rsating)',true);
};

document.getElementById('rBtn').onclick=function(){
  hap('light');
  var rt=document.getElementById('rtxt');
  rt.textContent='...';
  if(window.TelegramWidget&&typeof TelegramWidget.request==='function'){
    try{
      TelegramWidget.request('loyalty:refresh').then(function(res){
        rt.textContent='Yangilash';
        setDesc('☕️ Balans yangilandi!',true);
        if(res)upd(res);
      }).catch(function(){
        rt.textContent='Yangilash';
        setDesc('☕️ Balans yangilandi!',true);
      });
    }catch(e){
      rt.textContent='Yangilash';
      setDesc('☕️ Balans yangilandi!',true);
    }
  }else{
    setTimeout(function(){rt.textContent='Yangilash';setDesc('☕️ Balans yangilandi!',true)},700);
  }
};
document.getElementById('mBtn').onclick=function(){opn('https://gustocoffee.uz/#menu')};
})();
</script>
</body>
</html>
