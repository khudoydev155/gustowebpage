<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Gusto Menu</title>
<style>
:root{--bg:var(--tg-theme-bg-color,#0C0A08);--c:var(--tg-theme-secondary-bg-color,#181410);--b:#2C241C;--g:var(--tg-theme-button-color,#C6924D);--gl:#E6C387;--t:var(--tg-theme-text-color,#F5F1EA);--m:var(--tg-theme-hint-color,#A89F91);--r:10px}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
body{background:var(--bg);color:var(--t);padding:10px;font-size:12px;line-height:1.3;display:flex;flex-direction:column;gap:8px}
.hdr{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--b);padding-bottom:6px;gap:8px}
.hdr b{font-size:13px;letter-spacing:.3px;white-space:nowrap}
.tag{font-size:10px;background:rgba(198,146,77,.15);color:var(--g);padding:2px 7px;border-radius:12px;border:1px solid rgba(198,146,77,.3);font-weight:600;white-space:nowrap;flex-shrink:0}
.tabs{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{background:#120E0A;border:1px solid var(--b);color:var(--m);padding:4px 9px;border-radius:14px;font-size:10.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .15s}
.tab.on{background:rgba(198,146,77,.25);border-color:var(--g);color:var(--gl)}
.tab:active{transform:scale(.95)}
.list{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow-y:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.list::-webkit-scrollbar{display:none}
.item{background:#120E0A;border:1px solid var(--b);border-radius:var(--r);padding:8px 10px;display:flex;flex-direction:column;gap:4px;cursor:pointer;transition:all .15s}
.item:active{background:#1A140E;border-color:var(--g)}
.item.active{border-color:var(--g);background:#16110C}
.i-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.i-left{display:flex;align-items:center;gap:8px}
.i-icon{width:28px;height:28px;background:rgba(198,146,77,.15);border:1px solid rgba(198,146,77,.25);border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--gl);flex-shrink:0}
.i-name{font-weight:700;font-size:12px;color:var(--t)}
.i-price{font-size:11.5px;font-weight:700;color:var(--gl);font-family:monospace;white-space:nowrap}
.i-desc{font-size:10.5px;color:var(--m);line-height:1.25}
.i-extra{display:none;font-size:10px;color:var(--gl);background:rgba(198,146,77,.1);padding:4px 6px;border-radius:6px;border-left:2px solid var(--g);margin-top:2px}
.item.active .i-extra{display:block}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:2px}
.btn{background:var(--c);border:1px solid var(--b);color:var(--t);padding:8px;border-radius:var(--r);font-size:11px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;transition:all .15s}
.btn.pri{background:linear-gradient(135deg,rgba(198,146,77,.3),rgba(142,96,42,.35));border-color:var(--g);color:var(--gl)}
.btn:active{transform:scale(.97)}
</style>
</head>
<body>
<div class="hdr">
  <b>☕️ Gusto Speciality Menu</b>
  <span class="tag">Top Ichimliklar</span>
</div>
<div class="tabs" id="tabs">
  <div class="tab on" data-cat="all">Barchasi</div>
  <div class="tab" data-cat="coffee">Qahva</div>
  <div class="tab" data-cat="author">Mualliflik</div>
  <div class="tab" data-cat="dessert">Dessert</div>
</div>
<div class="list" id="list"></div>
<div class="btns">
  <button type="button" class="btn pri" id="openMenu">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
    <span>To'liq menyu</span>
  </button>
  <button type="button" class="btn" id="openBook">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    <span>Stol band qilish</span>
  </button>
</div>

<script>
(function(){
var ITEMS=[
  {id:1,cat:'author',name:'Ispancha Latte',price:'26 000',desc:'Espresso, kondensirlangan sut, ipakdek nozik sut ko\'pigi',extra:'✨ 320 ml • Issiq yoki Muzli • Gusto tavsiya etadi',ic:'☕️'},
  {id:2,cat:'coffee',name:'Raf Vanilla',price:'28 000',desc:'Espresso, 10% li qaymoq, tabiiy Madagaskar vanili',extra:'✨ 300 ml • Yumshoq shirin kremli ta\'m',ic:'🥛'},
  {id:3,cat:'author',name:'Pistachio Matcha',price:'32 000',desc:'Yapon seremonial matcha choyi, xushbo\'y pista suti',extra:'✨ 350 ml • Antioxidantlarga boy • O\'ziga xos ta\'m',ic:'🍵'},
  {id:4,cat:'coffee',name:'Flat White',price:'24 000',desc:'Double ristretto va zich mikro-ko\'pikli sut',extra:'✨ 220 ml • Kuchli qahva ta\'mi, 100% Arabica',ic:'☕️'},
  {id:5,cat:'author',name:'Bumble Coffee',price:'28 000',desc:'Yangi siqilgan apelsin sharbati, karamel va espresso',extra:'✨ 350 ml • Muzli, tetiklantiruvchi yorqin nordon-shirinlik',ic:'🍊'},
  {id:6,cat:'dessert',name:'San Sebastian',price:'35 000',desc:'Ispancha klassik kuyik krem-pishloqli chizkeyk',extra:'✨ 150 gr • Belgiyalik shokolad sousi bilan',ic:'🍰'}
];

var curCat='all';
function hap(t){try{if(window.TelegramWidget&&TelegramWidget.HapticFeedback){TelegramWidget.HapticFeedback.impactOccurred(t||'light')}else if(window.Telegram&&Telegram.WebApp&&Telegram.WebApp.HapticFeedback){Telegram.WebApp.HapticFeedback.impactOccurred(t||'light')}}catch(e){}}
function opn(u){hap('medium');try{if(window.TelegramWidget&&TelegramWidget.openLink){TelegramWidget.openLink(u);return}if(window.Telegram&&Telegram.WebApp&&Telegram.WebApp.openLink){Telegram.WebApp.openLink(u);return}}catch(e){}window.open(u,'_blank')}

function applyTheme(){
  var tp=(window.TelegramWidget&&TelegramWidget.themeParams)||(window.Telegram&&Telegram.WebApp&&Telegram.WebApp.themeParams);
  if(!tp)return;
  var r=document.documentElement;
  if(tp.bg_color)r.style.setProperty('--bg',tp.bg_color);
  if(tp.secondary_bg_color)r.style.setProperty('--c',tp.secondary_bg_color);
  if(tp.text_color)r.style.setProperty('--t',tp.text_color);
  if(tp.hint_color)r.style.setProperty('--m',tp.hint_color);
  if(tp.button_color)r.style.setProperty('--g',tp.button_color);
}
applyTheme();
if(window.TelegramWidget&&typeof TelegramWidget.onEvent==='function'){
  TelegramWidget.onEvent('themeChanged',applyTheme);
}
window.addEventListener('themeChanged',applyTheme);

function render(){
  var box=document.getElementById('list');box.innerHTML='';
  var flt=ITEMS.filter(function(it){return curCat==='all'||it.cat===curCat});
  flt.forEach(function(it){
    var el=document.createElement('div');
    el.className='item';
    el.innerHTML='<div class="i-top"><div class="i-left"><div class="i-icon">'+it.ic+'</div><div class="i-name">'+it.name+'</div></div><div class="i-price">'+it.price+' so\'m</div></div><div class="i-desc">'+it.desc+'</div><div class="i-extra">'+it.extra+'</div>';
    el.onclick=function(){hap('light');el.classList.toggle('active')};
    box.appendChild(el);
  });
}

var tabs=document.querySelectorAll('.tab');
tabs.forEach(function(tb){
  tb.onclick=function(){
    hap('light');
    tabs.forEach(function(x){x.classList.remove('on')});
    tb.classList.add('on');
    curCat=tb.getAttribute('data-cat');
    render();
  };
});

render();

document.getElementById('openMenu').onclick=function(){opn('https://gustocoffee.uz/#menu')};
document.getElementById('openBook').onclick=function(){opn('https://gustocoffee.uz/#table-reservation')};
})();
</script>
</body>
</html>
