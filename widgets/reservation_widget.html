<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Stol band qilish</title>
<style>
:root{--bg:#0C0A08;--c:#181410;--b:#2C241C;--g:#C6924D;--gl:#E6C387;--t:#F5F1EA;--m:#A89F91;--r:10px}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
body{background:var(--bg);color:var(--t);padding:10px;font-size:12px;line-height:1.3}
.box{display:flex;flex-direction:column;gap:8px}
.hdr{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--b);padding-bottom:6px;gap:8px}
.hdr b{font-size:13px;letter-spacing:.3px;white-space:nowrap}
.tag{font-size:10px;background:rgba(198,146,77,.15);color:var(--g);padding:2px 7px;border-radius:12px;border:1px solid rgba(198,146,77,.3);font-weight:600;white-space:nowrap;flex-shrink:0}
.lbl{font-size:9.5px;text-transform:uppercase;color:var(--m);font-weight:700;margin-bottom:3px;letter-spacing:.4px}
.pills,.times{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.times{grid-template-columns:repeat(6,1fr)}
.pill,.chip{background:#120E0A;border:1px solid var(--b);color:var(--m);padding:6px 2px;border-radius:8px;text-align:center;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s}
.pill.on,.chip.on{background:rgba(198,146,77,.25);border-color:var(--g);color:var(--gl)}
.pill:active,.chip:active{transform:scale(.95)}
.row{display:flex;align-items:center;justify-content:space-between;background:#120E0A;border:1px solid var(--b);padding:7px 10px;border-radius:var(--r)}
.cbtn{width:26px;height:26px;background:var(--c);border:1px solid var(--b);border-radius:6px;color:var(--t);font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.cbtn:active{background:rgba(198,146,77,.3);border-color:var(--g)}
.sbtn{background:linear-gradient(135deg,var(--g),#8E602A);color:#FFF;border:none;padding:9px;border-radius:var(--r);font-weight:700;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;transition:all .15s;margin-top:2px}
.sbtn:active{transform:scale(.98);opacity:.9}
.succ{display:none;flex-direction:column;align-items:center;gap:8px;padding:6px 0;text-align:center}
.ck{width:38px;height:38px;background:rgba(46,204,113,.15);border:1px solid #2ECC71;border-radius:50%;display:flex;align-items:center;justify-content:center}
.rcard{width:100%;background:#120E0A;border:1px solid var(--b);border-radius:var(--r);padding:8px 10px;display:flex;flex-direction:column;gap:5px;text-align:left;font-size:11px}
.rrow{display:flex;justify-content:space-between;align-items:center}
.code{font-family:monospace;font-size:13px;font-weight:700;color:var(--gl)}
.sactions{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%;margin-top:3px}
.mbtn{background:#120E0A;border:1px solid var(--b);color:var(--m);padding:7px;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer}
.mbtn.gold{background:rgba(198,146,77,.2);border-color:var(--g);color:var(--gl)}
.cntdown{display:inline-flex;align-items:center;gap:6px;background:rgba(198,146,77,.15);border:1px solid rgba(198,146,77,.35);padding:5px 10px;border-radius:20px;font-size:11px;font-weight:600;color:var(--gl);margin-top:2px}
.cddot{width:6px;height:6px;background:#2ECC71;border-radius:50%;animation:cdPulse 1.5s infinite ease-in-out}
@keyframes cdPulse{0%,100%{opacity:.4;transform:scale(.9)}50%{opacity:1;transform:scale(1.25)}}
</style>
</head>
<body>
<div class="box" id="form">
  <div class="hdr">
    <b>📅 Stol band qilish</b>
    <span class="tag">Gusto Xonqa</span>
  </div>
  <div>
    <div class="lbl">Tashrif kuni</div>
    <div class="pills" id="pc">
      <div class="pill on" data-d="bugun">Bugun</div>
      <div class="pill" data-d="ertaga">Ertaga</div>
      <div class="pill" data-d="indinga">Indinga</div>
    </div>
  </div>
  <div>
    <div class="lbl">Qulay vaqt</div>
    <div class="times" id="tc">
      <div class="chip">12:00</div>
      <div class="chip">14:00</div>
      <div class="chip">16:00</div>
      <div class="chip on">18:00</div>
      <div class="chip">19:30</div>
      <div class="chip">21:00</div>
    </div>
  </div>
  <div class="row">
    <span class="lbl" style="margin:0">Mehmonlar</span>
    <div style="display:flex;align-items:center;gap:8px">
      <button type="button" class="cbtn" id="dG">-</button>
      <span style="font-weight:700;min-width:50px;text-align:center" id="gVal">2 kishi</span>
      <button type="button" class="cbtn" id="iG">+</button>
    </div>
  </div>
  <button type="button" class="sbtn" id="subBtn">
    <span>Stolni tasdiqlash</span>
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
  </button>
</div>
<div class="succ" id="succ">
  <div class="ck">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2ECC71" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
  </div>
  <div style="font-size:14px;font-weight:700">Stol band qilindi!</div>
  <div class="rcard">
    <div class="rrow"><span style="color:var(--m)">Bron kodi:</span><span class="code" id="rCode">#GC-••••</span></div>
    <div class="rrow"><span style="color:var(--m)">Vaqt:</span><span style="font-weight:600" id="rTime">Bugun, 18:00</span></div>
    <div class="rrow"><span style="color:var(--m)">Mehmonlar:</span><span style="font-weight:600" id="rGuests">2 kishi</span></div>
    <div class="rrow"><span style="color:var(--m)">Filial:</span><span style="font-weight:600">Gusto Xonqa</span></div>
  </div>
  <div class="cntdown" id="cntdown">
    <span class="cddot"></span>
    <span id="cdText">⏳ Tashrif vaqti hisoblanmoqda...</span>
  </div>
  <div class="sactions">
    <button type="button" class="mbtn" id="rstBtn">🔄 Yangi bron</button>
    <button type="button" class="mbtn gold" id="menBtn">☕️ Menyu</button>
  </div>
</div>
<script>
(function(){
var S={day:'bugun',time:'18:00',guests:2},cdT=null;
function hap(t){try{if(window.TelegramWidget&&TelegramWidget.HapticFeedback){TelegramWidget.HapticFeedback.impactOccurred(t||'light')}else if(window.Telegram&&Telegram.WebApp&&Telegram.WebApp.HapticFeedback){Telegram.WebApp.HapticFeedback.impactOccurred(t||'light')}}catch(e){}}
function hapNotif(t){try{if(window.TelegramWidget&&TelegramWidget.HapticFeedback&&TelegramWidget.HapticFeedback.notificationOccurred){TelegramWidget.HapticFeedback.notificationOccurred(t)}else if(window.Telegram&&Telegram.WebApp&&Telegram.WebApp.HapticFeedback&&Telegram.WebApp.HapticFeedback.notificationOccurred){Telegram.WebApp.HapticFeedback.notificationOccurred(t)}}catch(e){}}
function opn(u){hap('medium');try{if(window.TelegramWidget&&TelegramWidget.openLink){TelegramWidget.openLink(u);return}if(window.Telegram&&Telegram.WebApp&&Telegram.WebApp.openLink){Telegram.WebApp.openLink(u);return}}catch(e){}window.open(u,'_blank')}
var pills=document.querySelectorAll('.pill');
pills.forEach(function(p){p.onclick=function(){hap('light');pills.forEach(function(x){x.classList.remove('on')});p.classList.add('on');S.day=p.getAttribute('data-d')}});
var chips=document.querySelectorAll('.chip');
chips.forEach(function(c){c.onclick=function(){hap('light');chips.forEach(function(x){x.classList.remove('on')});c.classList.add('on');S.time=c.textContent.trim()}});
var gEl=document.getElementById('gVal');
document.getElementById('dG').onclick=function(){hap('light');if(S.guests>1){S.guests--;gEl.textContent=S.guests+' kishi'}};
document.getElementById('iG').onclick=function(){hap('light');if(S.guests<12){S.guests++;gEl.textContent=S.guests+' kishi'}};

function startCd(dStr,tStr){
  if(cdT)clearInterval(cdT);
  var ce=document.getElementById('cdText');
  function tick(){
    var now=new Date(),tgt=new Date(),pts=(tStr||'18:00').split(':'),h=parseInt(pts[0],10)||18,m=parseInt(pts[1],10)||0;
    if(dStr==='ertaga')tgt.setDate(tgt.getDate()+1);
    else if(dStr==='indinga')tgt.setDate(tgt.getDate()+2);
    tgt.setHours(h,m,0,0);
    var df=tgt.getTime()-now.getTime();
    if(df<=0){ce.textContent='☕️ Sizni kafeda kutamiz!';return}
    var hr=Math.floor(df/3600000),mn=Math.floor((df%3600000)/60000);
    ce.textContent=hr>0?('⏳ Tashrifgacha: '+hr+'s '+mn+'d qoldi'):('⏳ Tashrifgacha: '+mn+' daqiqa qoldi');
  }
  tick();cdT=setInterval(tick,30000);
}

function showSuc(d){
  document.getElementById('form').style.display='none';
  document.getElementById('succ').style.display='flex';
  var dt=d.day==='bugun'?'Bugun':(d.day==='ertaga'?'Ertaga':'Indinga');
  document.getElementById('rTime').textContent=dt+', soat '+d.time;
  document.getElementById('rGuests').textContent=d.guests+' kishi';
  if(d.booking_code)document.getElementById('rCode').textContent='#'+d.booking_code;
  startCd(d.day,d.time);
  hapNotif('success');
}

var sb=document.getElementById('subBtn');
sb.onclick=function(){
  hap('heavy');
  sb.disabled=true;
  sb.style.opacity='.5';
  sb.textContent='Yuborilmoqda...';
  var req='res:'+S.day+':'+S.time+':'+S.guests;
  var fallbackCode='GC-'+Math.floor(1000+Math.random()*9000);

  if(window.TelegramWidget&&typeof TelegramWidget.request==='function'){
    try{
      TelegramWidget.request(req).then(function(res){
        var code=fallbackCode;
        try{
          var obj=(typeof res==='string')?JSON.parse(res):(res&&res.result?(typeof res.result==='string'?JSON.parse(res.result):res.result):res);
          if(obj&&obj.booking_code)code=obj.booking_code;
        }catch(e){}
        showSuc({day:S.day,time:S.time,guests:S.guests,booking_code:code});
      }).catch(function(){
        showSuc({day:S.day,time:S.time,guests:S.guests,booking_code:fallbackCode});
      });
    }catch(e){
      showSuc({day:S.day,time:S.time,guests:S.guests,booking_code:fallbackCode});
    }
  }else{
    showSuc({day:S.day,time:S.time,guests:S.guests,booking_code:fallbackCode});
  }
};

document.getElementById('rstBtn').onclick=function(){
  hap('light');if(cdT)clearInterval(cdT);document.getElementById('succ').style.display='none';document.getElementById('form').style.display='flex';
  sb.disabled=false;sb.style.opacity='1';sb.innerHTML='<span>Stolni tasdiqlash</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>';
};
document.getElementById('menBtn').onclick=function(){opn('https://gustocoffee.uz/#menu')};

function upd(c){if(!c)return;try{var p=typeof c==='string'?JSON.parse(c):c;if(p&&p.status==='confirmed')showSuc(p)}catch(e){}}
if(window.TelegramWidget){
  if(TelegramWidget.chatData)upd(TelegramWidget.chatData);
  if(typeof TelegramWidget.onEvent==='function'){
    TelegramWidget.onEvent('chatDataChanged',function(){if(TelegramWidget.chatData)upd(TelegramWidget.chatData)});
  }
}
window.addEventListener('chatDataChanged',function(){if(window.TelegramWidget&&TelegramWidget.chatData)upd(TelegramWidget.chatData)});
})();
</script>
</body>
</html>
