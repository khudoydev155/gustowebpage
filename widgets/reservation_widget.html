<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Gusto Bron</title>
<style>
:root{--bg:#0C0A08;--c:#181410;--b:#2C241C;--g:#C6924D;--t:#F5F1EA;--m:#A89F91;--r:10px}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
body{background:var(--bg);color:var(--t);padding:10px;font-size:12px;line-height:1.3;display:flex;flex-direction:column;gap:8px}
.hdr{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--b);padding-bottom:6px}
.hdr b{font-size:13px;letter-spacing:.3px;color:var(--t)}
.badge{font-size:10px;background:rgba(198,146,77,.15);color:var(--g);padding:2px 7px;border-radius:12px;border:1px solid rgba(198,146,77,.3);font-weight:600}
.lbl{font-size:10px;text-transform:uppercase;color:var(--m);font-weight:600;margin-bottom:4px}
.pills{display:flex;gap:5px}
.pill{flex:1;padding:8px 4px;background:var(--c);border:1px solid var(--b);color:var(--m);border-radius:var(--r);text-align:center;font-size:11.5px;font-weight:500;cursor:pointer}
.pill.on{background:rgba(198,146,77,.2);border-color:var(--g);color:#FFF;font-weight:600}
.times{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}
.times::-webkit-scrollbar{display:none}
.chip{padding:6px 11px;background:var(--c);border:1px solid var(--b);border-radius:7px;color:var(--m);font-size:11.5px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--g);border-color:var(--g);color:#0C0A08;font-weight:700}
.row{display:flex;align-items:center;justify-content:space-between;background:var(--c);border:1px solid var(--b);border-radius:var(--r);padding:6px 10px}
.cbtn{width:34px;height:34px;border-radius:7px;background:#251E17;border:1px solid var(--b);color:var(--t);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer}
.cbtn:active{background:var(--g);color:#0C0A08}
.sbtn{width:100%;background:linear-gradient(135deg,var(--g),#8E602A);border:none;border-radius:var(--r);color:#0C0A08;font-size:12.5px;font-weight:700;padding:10px;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.sbtn:active{opacity:.9}
.succ{display:none;flex-direction:column;align-items:center;text-align:center;padding:10px 4px;gap:8px}
.ck{width:38px;height:38px;border-radius:50%;background:rgba(46,204,113,.15);border:1px solid #2ECC71;display:flex;align-items:center;justify-content:center}
.rcard{width:100%;background:var(--c);border:1px solid var(--b);border-radius:var(--r);padding:8px 12px;display:flex;flex-direction:column;gap:5px;text-align:left;font-size:11.5px}
.rrow{display:flex;justify-content:space-between}
.code{background:rgba(198,146,77,.2);color:var(--g);border:1px solid rgba(198,146,77,.4);padding:1px 6px;border-radius:5px;font-family:monospace;font-weight:700}
.sactions{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%}
.mbtn{padding:8px;background:var(--c);border:1px solid var(--b);color:var(--t);border-radius:var(--r);font-size:11px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px}
.mbtn.gold{border-color:var(--g);color:var(--g)}
.mbtn:active{background:rgba(198,146,77,.2)}
</style>
</head>
<body>
<div id="form" style="display:flex;flex-direction:column;gap:8px">
  <div class="hdr">
    <b>📅 Stol band qilish</b>
    <span class="badge">Gusto Xonqa</span>
  </div>
  <div>
    <div class="lbl">Tashrif kuni</div>
    <div class="pills">
      <div class="pill on" data-d="bugun">Bugun</div>
      <div class="pill" data-d="ertaga">Ertaga</div>
      <div class="pill" data-d="indinga">Indinga</div>
    </div>
  </div>
  <div>
    <div class="lbl">Qulay vaqt</div>
    <div class="times" id="tc">
      <div class="chip">12:00</div>
      <div class="chip">14:00</div>
      <div class="chip">16:00</div>
      <div class="chip on">18:00</div>
      <div class="chip">19:30</div>
      <div class="chip">21:00</div>
    </div>
  </div>
  <div class="row">
    <span class="lbl" style="margin:0">Mehmonlar</span>
    <div style="display:flex;align-items:center;gap:8px">
      <button type="button" class="cbtn" id="dG">-</button>
      <span style="font-weight:700;min-width:50px;text-align:center" id="gVal">2 kishi</span>
      <button type="button" class="cbtn" id="iG">+</button>
    </div>
  </div>
  <button type="button" class="sbtn" id="subBtn">
    <span>Stolni tasdiqlash</span>
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
  </button>
</div>
<div class="succ" id="succ">
  <div class="ck">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2ECC71" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
  </div>
  <div style="font-size:14px;font-weight:700">Stol band qilindi!</div>
  <div class="rcard">
    <div class="rrow"><span style="color:var(--m)">Bron kodi:</span><span class="code" id="rCode">#GC-••••</span></div>
    <div class="rrow"><span style="color:var(--m)">Vaqt:</span><span style="font-weight:600" id="rTime">Bugun, 18:00</span></div>
    <div class="rrow"><span style="color:var(--m)">Mehmonlar:</span><span style="font-weight:600" id="rGuests">2 kishi</span></div>
    <div class="rrow"><span style="color:var(--m)">Filial:</span><span style="font-weight:600">Gusto Xonqa</span></div>
  </div>
  <div class="sactions">
    <button type="button" class="mbtn" id="rstBtn">🔄 Yangi bron</button>
    <button type="button" class="mbtn gold" id="menBtn">☕️ Menyu</button>
  </div>
</div>
<script>
(function(){
var S={day:'bugun',time:'18:00',guests:2};
function hap(t){try{if(window.TelegramWidget&&TelegramWidget.HapticFeedback){TelegramWidget.HapticFeedback.impactOccurred(t||'light')}else if(window.Telegram&&Telegram.WebApp&&Telegram.WebApp.HapticFeedback){Telegram.WebApp.HapticFeedback.impactOccurred(t||'light')}}catch(e){}}
function opn(u){hap('medium');try{if(window.TelegramWidget&&TelegramWidget.openLink){TelegramWidget.openLink(u);return}if(window.Telegram&&Telegram.WebApp&&Telegram.WebApp.openLink){Telegram.WebApp.openLink(u);return}}catch(e){}window.open(u,'_blank')}
var pills=document.querySelectorAll('.pill');
pills.forEach(function(p){p.onclick=function(){hap('light');pills.forEach(function(x){x.classList.remove('on')});p.classList.add('on');S.day=p.getAttribute('data-d')}});
var chips=document.querySelectorAll('.chip');
chips.forEach(function(c){c.onclick=function(){hap('light');chips.forEach(function(x){x.classList.remove('on')});c.classList.add('on');S.time=c.textContent.trim()}});
var gEl=document.getElementById('gVal');
document.getElementById('dG').onclick=function(){hap('light');if(S.guests>1){S.guests--;gEl.textContent=S.guests+' kishi'}};
document.getElementById('iG').onclick=function(){hap('light');if(S.guests<12){S.guests++;gEl.textContent=S.guests+' kishi'}};
var sb=document.getElementById('subBtn');
sb.onclick=function(){
  hap('heavy');sb.disabled=true;sb.style.opacity='.5';sb.textContent='Yuborilmoqda...';
  if(window.TelegramWidget&&TelegramWidget.request){TelegramWidget.request('res:'+S.day+':'+S.time+':'+S.guests)}
  showSuc({day:S.day,time:S.time,guests:S.guests,booking_code:'GC-'+Math.floor(1000+Math.random()*9000)});
};
function showSuc(d){
  document.getElementById('form').style.display='none';
  document.getElementById('succ').style.display='flex';
  var dt=d.day==='bugun'?'Bugun':(d.day==='ertaga'?'Ertaga':'Indinga');
  document.getElementById('rTime').textContent=dt+', soat '+d.time;
  document.getElementById('rGuests').textContent=d.guests+' kishi';
  if(d.booking_code)document.getElementById('rCode').textContent='#'+d.booking_code;
}
document.getElementById('rstBtn').onclick=function(){
  hap('light');document.getElementById('succ').style.display='none';document.getElementById('form').style.display='flex';
  sb.disabled=false;sb.style.opacity='1';sb.innerHTML='<span>Stolni tasdiqlash</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>';
};
document.getElementById('menBtn').onclick=function(){opn('https://gustocoffee.uz/#menu')};
function upd(c){if(!c)return;try{var p=typeof c==='string'?JSON.parse(c):c;if(p&&p.status==='confirmed')showSuc(p)}catch(e){}}
if(window.TelegramWidget&&TelegramWidget.chatData)upd(TelegramWidget.chatData);
window.addEventListener('chatDataChanged',function(){if(window.TelegramWidget&&TelegramWidget.chatData)upd(TelegramWidget.chatData)});
})();
</script>
</body>
</html>
